<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores — VMO Concretos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/vendor/xlsx-0.20.3.full.min.js"></script>
<script src="/logistica.logic.js?v=2026-11-19d"></script>
<script src="/calendario.js?v=2026-10-19b"></script>
<script src="/logistica.api.js?v=2026-10-08b"></script>
<style>
  :root{
    color-scheme: dark;
    --vmo-red:#D32F2F; --vmo-red-dark:#F87171;
    --ink:#EEF2F7; --muted:rgba(238,242,247,0.55); --line:rgba(255,255,255,0.07);
    --bg:#0D1829; --card:#152535; --elevated:#1C3045;
    --ok:#34D399; --warn:#F59E0B; --err:#F87171;
    --bomba:#60A5FA; --camion:#34D399; --tiempo:#F59E0B; --tiempo2:#A78BFA; --cartera:#22D3EE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter','Segoe UI',system-ui,sans-serif;
    background-color:var(--bg);
    background-image:
      radial-gradient(rgba(211,47,47,0.03) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size:40px 40px, 20px 20px; background-position:0 0, 10px 10px;
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--card); color:var(--ink); padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px; position:relative;
  }
  header::after{content:''; position:absolute; bottom:-1px; left:0; width:180px; height:2px;
    background:linear-gradient(90deg, var(--vmo-red) 0%, transparent 100%);}
  header .brand{display:flex; flex-direction:column; gap:2px;}
  header .brand .tag{text-transform:uppercase; letter-spacing:1px; font-size:10.5px; color:var(--muted);}
  header h1{margin:0; font-size:17px; font-weight:700; letter-spacing:-.2px;}

  .wrap{max-width:1300px; margin:0 auto; padding:20px 24px 60px;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:20px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.45);}
  .panel-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .panel-head h2{margin:0; font-size:14px; font-weight:700;}
  .panel-head .sub{font-size:12px; color:var(--muted);}
  .panel-body{padding:16px 18px;}
  .tabla{overflow-x:auto;}

  .subidas{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:14px;}
  .subida{background:var(--elevated); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:12.5px;}
  .subida strong{display:block; font-size:13px; margin-bottom:2px;}
  .subida .cargado{color:var(--muted); margin:2px 0 8px;}
  .subida input[type="file"]{font-family:inherit; font-size:12px; color:var(--muted); max-width:100%;}
  .subida .estado{margin-top:8px; line-height:1.5;}
  .subida .estado.ok{color:var(--ok);} .subida .estado.err{color:var(--err);}
  .btn{padding:7px 14px; background:var(--vmo-red); color:#fff; border:none; border-radius:8px;
    font-weight:700; font-size:12.5px; cursor:pointer; font-family:inherit; margin-top:8px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .filtro{display:flex; align-items:flex-end; flex-wrap:wrap; gap:10px 14px;
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:18px;}
  .filtro .campo{display:flex; flex-direction:column; gap:5px; min-width:160px;}
  .filtro label{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700;}
  .filtro input[type="date"], .filtro .cal-campo{
    background:var(--elevated); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; font-size:13px; font-weight:600; font-family:inherit; min-width:170px;}
  .filtro .cal-campo:focus-visible{outline:2px solid var(--vmo-red); outline-offset:2px;}
  .filtro .alcance{margin-left:auto; font-size:11.5px; color:var(--muted); text-align:right; align-self:center; line-height:1.5;}

  .sec{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700; margin:26px 0 10px;}
  .sec .fuente{text-transform:none; letter-spacing:0; font-weight:500; margin-left:8px;}
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:12px;}
  .kpis + :not(.kpis){margin-top:8px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-top:3px solid var(--vmo-red);
    border-radius:12px; padding:14px 16px; box-shadow:0 1px 4px rgba(0,0,0,0.45);}
  .kpi.b{border-top-color:var(--bomba);} .kpi.c{border-top-color:var(--camion);} .kpi.t{border-top-color:var(--tiempo);}
  .kpi.e{border-top-color:var(--bomba);} .kpi.p{border-top-color:var(--tiempo2);} .kpi.s{border-top-color:var(--tiempo);} .kpi.d{border-top-color:var(--vmo-red-dark);}
  .kpi .label{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:700;}
  .kpi .value{font-size:28px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums;}
  .kpi .sub{font-size:11px; color:var(--muted); margin-top:2px; line-height:1.4;}
  .kpis.metas{grid-template-columns:repeat(5,1fr);}
  .kpis.metas.seis{grid-template-columns:repeat(3,1fr);}
  /* Contra la meta con cartera, cubicacion, resistencia y compras (2026-11-19): 15 tarjetas, 5 por fila */
  .kpis.metas.doce{grid-template-columns:repeat(5,1fr);}
  .kpi.f{border-top-color:var(--cartera);}
  .sel-cartera{background:var(--elevated); color:var(--ink); border:1px solid var(--line); border-radius:6px;
    padding:4px 6px; font-family:inherit; font-size:12px; max-width:230px;}
  .sel-cartera:focus-visible{outline:2px solid var(--vmo-red); outline-offset:1px;}
  td.tachado{text-decoration:line-through; color:var(--muted);}
  .aviso{color:var(--warn); font-size:12.5px; line-height:1.6;}
  .corte-campos{display:flex; flex-wrap:wrap; gap:8px 12px; margin:8px 0 4px;}
  .corte-campos label{display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--muted);}
  .corte-campos input{background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:6px;
    padding:5px 8px; font-family:inherit; font-size:12.5px; width:150px;}
  .err-corte{color:var(--err);}
  .kpi.m.si{border-top-color:var(--ok);} .kpi.m.no{border-top-color:var(--err);} .kpi.m.sd{border-top-color:var(--muted);}
  .em{font-weight:700;} .em.si{color:var(--ok);} .em.no{color:var(--err);}
  .zonas-meta{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11.5px; margin-top:8px; color:var(--muted);}
  .zonas-meta strong{color:var(--ink); font-variant-numeric:tabular-nums;}
  /* Contra la meta alineada (2026-11-20): cada tarjeta toma las filas de la grilla
     (subgrid), asi el titulo, el numero, el "Cumple" y el detalle quedan a la misma
     altura en toda la fila aunque un titulo o su explicacion ocupen dos renglones. */
  .kpi .sub{text-wrap:pretty;}
  .kpi.m .pie{margin-top:8px;}
  .kpi.m .pie:empty{display:none;}
  .kpi.m .pie .zonas-meta{margin-top:0;}
  .kpi.m .pie .zonas-meta + .sub{margin-top:6px;}
  @supports (grid-template-rows:subgrid){
    .kpis.metas.doce{row-gap:0;}
    .kpis.metas.doce > .kpi.m{display:grid; grid-template-rows:subgrid; grid-row:span 4; row-gap:0;
      align-content:start; margin-bottom:12px;}
  }

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; padding:9px 10px; background:rgba(0,0,0,.3);
    border-bottom:1px solid var(--line); color:var(--muted); font-weight:700;
    text-transform:uppercase; font-size:10.5px; letter-spacing:.7px; white-space:nowrap;}
  tbody td{padding:8px 10px; border-bottom:1px solid rgba(255,255,255,0.03); vertical-align:middle;}
  tbody tr:hover{background:rgba(255,255,255,.02);}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
  tr.zona td{background:rgba(255,255,255,.04); padding:7px 10px; font-size:12px;}
  tr.zona span{color:var(--muted); margin-left:10px;}
  .gris{color:var(--muted); font-size:11.5px;}
  td.corta{max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .barra{height:7px; border-radius:4px; background:rgba(255,255,255,.07); overflow:hidden; min-width:70px;}
  .barra span{display:block; height:100%; border-radius:4px;}
  .dos{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;}
  .leyenda{display:flex; flex-wrap:wrap; gap:18px; font-size:11.5px; color:var(--muted); margin-top:6px;}
  .leyenda i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px;}
  details.calc{background:var(--card); border:1px dashed rgba(245,158,11,.4); border-radius:12px; margin-bottom:20px;}
  details.calc summary{cursor:pointer; padding:12px 18px; font-size:13px; font-weight:700;}
  details.calc .cuerpo{padding:0 18px 14px; font-size:12.5px; line-height:1.55;}
  details.calc td{padding:6px 10px; vertical-align:top; border-bottom:1px solid rgba(255,255,255,.04);}
  details.calc td:first-child{width:24%; font-weight:700;}
  .ojo{color:var(--warn); margin-top:8px;}
  td.mas-fila{text-align:center; padding:6px;}
  .btn-todos{background:transparent; border:1px solid var(--line); border-radius:7px; color:var(--muted);
    font-family:inherit; font-size:12px; padding:5px 12px; cursor:pointer;}
  .btn-todos:hover{color:var(--ink); border-color:var(--muted);}
  .empty-state{padding:34px 20px; text-align:center; color:var(--muted); font-size:13px;}
  svg .punto:hover{r:6;}
  footer{text-align:center; padding:26px; color:var(--muted); font-size:11.5px;}

  @media (max-width:900px){
    .kpis, .kpis.metas, .kpis.metas.seis, .kpis.metas.doce{grid-template-columns:repeat(2,1fr);}
    .dos, .subidas{grid-template-columns:1fr;}
  }
  @media (max-width:600px){
    .wrap{padding:16px;}
    .filtro .alcance{margin-left:0; text-align:left;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="tag">VMO Concretos · Logística</span>
    <h1>Indicadores</h1>
  </div>
</header>

<div class="wrap">
  <div class="panel">
    <div class="panel-head"><h2>Reportes del sistema</h2><span class="sub">se exportan de CBSListas por rango de fechas; lo nuevo reemplaza lo guardado de esas fechas</span></div>
    <div class="panel-body subidas" id="subidas"></div>
  </div>

  <div id="filtro"></div>
  <div id="contenido"><div class="panel"><div class="empty-state">Cargando...</div></div></div>
</div>

<footer>VMO Concretos · Indicadores de Logística</footer>

<script>
// Indicadores de Logistica (2026-10-28), segun el boceto aprobado: metros
// bombeados por equipo, metros transportados por camion y cumplimiento de
// tiempos de despacho, siempre separados por zona. El calculo vive en
// indicadoresDelPeriodo(), en logistica.logic.js; aca se eligen las fechas,
// se suben los dos reportes del sistema y se dibuja.

const $ = id => document.getElementById(id);
let diasEnMemoria = [];          // [{fecha, state, assumptions}] del historial, una sola vez
let reportes = {bombeo: [], tiempos: [], fechas: {}};
let fechasElegibles = [];
let pendiente = {};              // lo leido de un Excel, esperando "Guardar"
// Las listas largas muestran los primeros 10 de cada zona (pedido del usuario,
// 2026-10-28); "Mostrar todos" abre esa lista y queda abierta hasta recogerla.
const TOPE_LISTA = 10;
const listasAbiertas = new Set();
const recortar = (id, lista) => listasAbiertas.has(id) ? lista : lista.slice(0, TOPE_LISTA);
const botonTodos = (id, total, columnas) => total <= TOPE_LISTA ? '' :
  `<tr><td class="mas-fila" colspan="${columnas}"><button type="button" class="btn-todos" data-lista="${id}">${listasAbiertas.has(id)
    ? 'Mostrar solo los primeros ' + TOPE_LISTA : 'Mostrar todos (' + total + ')'}</button></td></tr>`;

const n0 = v => v === null || v === undefined ? '—' : Math.round(v).toLocaleString('en-US');
const n1 = v => v === null || v === undefined ? '—' : (Math.round(v * 10) / 10).toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const pct = p => p === null || p === undefined ? '—' : Math.round(p) + '%';
const fc = f => f ? f.slice(8, 10) + '/' + f.slice(5, 7) + '/' + f.slice(0, 4) : '—';
const fcc = f => f.slice(8, 10) + '/' + f.slice(5, 7);
const barra = (v, max, color) => `<div class="barra"><span style="width:${max ? Math.round(100 * v / max) : 0}%; background:${color};"></span></div>`;
const colorP = p => p === null ? 'var(--muted)' : p >= 95 ? 'var(--ok)' : p >= 85 ? 'var(--warn)' : 'var(--err)';
const filaZona = (zona, detalle, columnas) => `<tr class="zona"><td colspan="${columnas}"><strong>${esc(zona)}</strong><span>${detalle}</span></td></tr>`;
const sinDatoTexto = g => `Sin dato: ${g.n} de ${g.n + g.sin} pedidos con Hora Fin`;
const calculo = (titulo, fuente, filas, ojo) => `<details class="calc"><summary>Cómo se calcula · ${titulo}</summary>
  <div class="cuerpo"><div class="gris" style="margin-bottom:8px;">De dónde sale: ${fuente}</div>
  <table><tbody>${filas.map(([q, c]) => `<tr><td>${q}</td><td>${c}</td></tr>`).join('')}</tbody></table>
  ${ojo ? `<div class="ojo"><strong>Ojo:</strong> ${ojo}</div>` : ''}</div></details>`;

function mensaje(texto){ $('contenido').innerHTML = `<div class="panel"><div class="empty-state">${texto}</div></div>`; }
const enRango = f => f >= $('desde').value && f <= $('hasta').value;

// ---- Subida de los reportes ----
// Los dos primeros desde el 2026-10-28; los otros cinco, listas de CBS para
// los indicadores de gestion, desde el 2026-11-17. Las batchadas vienen en dos
// archivos (SDN y las moviles) y se pueden elegir los dos juntos.
const REPORTES = [
  {tipo: 'bombeo', titulo: 'Metros bombeados por equipo', leer: parseBombeoSheets, unidad: 'celdas equipo-día',
   error: 'No es el reporte "Metros bombeados por equipo" (no encontré la columna idEquipo y las fechas).'},
  {tipo: 'tiempos', titulo: 'Cumplimiento de tiempos de despacho', leer: parseTiemposSheets, unidad: 'pedidos',
   error: 'No es el reporte "Cumplimiento de tiempos de despacho" (no encontré OrdComp, Fecha, Cantidad y Total In).'},
  {tipo: 'disponibilidad', titulo: 'Disponibilidad de Equipos y el Uso', leer: parseDisponibilidadSheets, unidad: 'equipos por día'},
  {tipo: 'batchadas', titulo: 'Batchadas PLC y Bachadas PLC Planta Moviles Centralizado', leer: parseBatchadasSheets, unidad: 'cargas', varios: true,
   nota: 'Los dos archivos: el de SDN y el centralizado de las móviles.'},
  {tipo: 'incidencias', titulo: 'Bitácora Incidencias en Servicios', leer: parseIncidenciasSheets, unidad: 'servicios'},
  {tipo: 'reclamos', titulo: 'Reporte de Reclamaciones', leer: parseReclamosSheets, unidad: 'reclamos'},
  {tipo: 'anulados', titulo: 'Conduce Anulados', leer: parseAnuladosSheets, unidad: 'conduces'},
  // Compras (2026-11-19): las lineas de solicitud recibidas, por fecha de la O/C.
  {tipo: 'compras', titulo: 'Tiempos de sol. compra', leer: parseComprasSheets, unidad: 'líneas de solicitud',
   nota: 'Se filtra por la fecha de la orden de compra y solo trae lo recibido: conviene bajarla desde el mes anterior.',
   error: 'No es la lista "Tiempos de sol. compra" (no encontré Solicitud, FechaSolicitud, Objetivo y Cumple).'},
  // Las roturas de Calidad (2026-11-19): solo las cargas con muestra.
  {tipo: 'roturas', titulo: 'Batchada vs Roturas de Calidad', leer: parseRoturasSheets, unidad: 'muestras',
   nota: 'La rotura a 28 días llega un mes después: conviene bajarla desde el mes anterior.',
   error: 'No es la lista "Batchada vs Roturas de Calidad" (no encontré Planta, Fecha, Resistencia y Roturas28).'},
  // La cartera (2026-11-19): un corte por vez, con su fecha y la tasa del dolar.
  {tipo: 'cartera', titulo: 'Solicitudes (antigüedad de saldos)', leer: parseCarteraSheets, unidad: 'facturas', corte: true,
   nota: 'Bajada con fecha de corte (el cierre del mes). Al subirla se pone esa fecha y la tasa del dólar.',
   error: 'No es la lista "Solicitudes" (no encontré Moneda, Nombre, Factura, los tramos y Balance Final).'},
];
const fechasDe = tipo => (reportes.fechas || {})[tipo] || [];
function rangoTexto(fechas){
  return fechas.length ? `Guardado: ${fechas.length} día(s) con datos, ${fc(fechas[0])} al ${fc(fechas[fechas.length - 1])}` : 'Todavía no se subió ninguno.';
}
function armarSubidas(){
  $('subidas').innerHTML = REPORTES.map(r => `<div class="subida">
      <strong>${r.titulo}</strong>${r.nota ? `<div class="cargado">${r.nota}</div>` : ''}
      <div class="cargado" id="cargado-${r.tipo}">—</div>
      <input type="file" id="file-${r.tipo}" accept=".xls,.xlsx"${r.varios ? ' multiple' : ''}>
      <div class="estado" id="estado-${r.tipo}"></div>
    </div>`).join('');
  REPORTES.forEach(r => $('file-' + r.tipo).addEventListener('change', ev => leerArchivos(ev.target, r)));
}
function pintarCargados(){
  REPORTES.forEach(r => { const f = fechasDe(r.tipo);
    $('cargado-' + r.tipo).textContent = !r.corte ? rangoTexto(f)
      : f.length ? `Guardado: ${f.length} corte(s), el último del ${fc(f[f.length - 1])}` : 'Todavía no se subió ninguno.'; });
}
const leerUno = file => new Promise((ok, mal) => {
  const reader = new FileReader();
  reader.onload = ev => { try {
    const wb = XLSX.read(new Uint8Array(ev.target.result), {type: 'array', cellDates: false});
    ok(wb.SheetNames.map(nombre => ({nombre, rows: XLSX.utils.sheet_to_json(wb.Sheets[nombre], {header: 1, defval: null, raw: true})})));
  } catch (err) { mal(err); } };
  reader.onerror = () => mal(reader.error);
  reader.readAsArrayBuffer(file);
});
async function leerArchivos(input, r){
  const estado = $('estado-' + r.tipo), files = [...input.files];
  if (!files.length) return;
  estado.className = 'estado'; estado.textContent = 'Leyendo...';
  delete pendiente[r.tipo];
  try {
    const leidos = [];
    for (const file of files){
      const leido = r.leer(await leerUno(file));
      if (!leido || !leido.desde){
        estado.className = 'estado err';
        estado.textContent = files.length > 1 ? `"${file.name}": ${r.error || `no es el reporte "${r.titulo}".`}` : (r.error || `No es el reporte "${r.titulo}".`);
        return;
      }
      leidos.push(leido);
    }
    pendiente[r.tipo] = leidos;
    if (r.corte){
      const l = leidos[0];
      estado.innerHTML = `${n0(l.filas.length)} ${r.unidad} de ${n0(l.clientes)} clientes${l.conDolares ? ', en RD$ y US$' : ''}; la más nueva es del ${fc(l.hasta)}.
        <div class="corte-campos"><label>Fecha de corte<input type="date" id="corte-${r.tipo}" value="${l.hasta}"></label>
        ${l.conDolares ? `<label>Tasa del dólar (RD$)<input type="number" id="tasa-${r.tipo}" min="0" step="0.0001" inputmode="decimal"></label>` : ''}</div>
        <span class="gris">Si ya hay un corte guardado con esa fecha, se reemplaza.</span><div class="err-corte" id="err-${r.tipo}"></div>
        <button type="button" class="btn" id="guardar-${r.tipo}">Guardar</button>`;
      $('guardar-' + r.tipo).addEventListener('click', () => guardar(r));
      return;
    }
    const desde = leidos.map(l => l.desde).sort()[0], hasta = leidos.map(l => l.hasta).sort().pop();
    const ya = fechasDe(r.tipo).filter(f => f >= desde && f <= hasta).length;
    estado.textContent = '';
    estado.insertAdjacentHTML('beforeend', leidos.map(l => `${n0(l.filas.length)} ${r.unidad}${l.fuente ? ` (${l.fuente === 'sdn' ? 'SDN' : 'móviles'})` : ''}, del ${fc(l.desde)} al ${fc(l.hasta)}.`).join('<br>')
      + (ya ? `<br>Reemplaza lo guardado de esas fechas (${ya} día(s) con datos).` : '')
      + `<br><button type="button" class="btn" id="guardar-${r.tipo}">Guardar</button>`);
    $('guardar-' + r.tipo).addEventListener('click', () => guardar(r));
  } catch (err) {
    estado.className = 'estado err'; estado.textContent = 'Error leyendo el archivo: ' + err.message;
  }
}
async function guardar(r){
  const estado = $('estado-' + r.tipo), leidos = pendiente[r.tipo] || [];
  const btn = $('guardar-' + r.tipo); if (btn) btn.disabled = true;
  let envios = leidos;
  if (r.corte){
    // La cartera va con la fecha de corte y la tasa que se escribieron.
    const corte = $('corte-' + r.tipo).value, tasaEl = $('tasa-' + r.tipo), tasa = tasaEl ? parseFloat(tasaEl.value) : null;
    const falta = !/^\d{4}-\d{2}-\d{2}$/.test(corte) ? 'Elegí la fecha de corte.' : tasaEl && !(tasa > 0) ? 'Poné la tasa del dólar de ese día.' : '';
    if (falta){ $('err-' + r.tipo).textContent = falta; if (btn) btn.disabled = false; return; }
    envios = leidos.map(l => ({desde: corte, hasta: corte, tasa, filas: l.filas.map(f => ({...f, fecha: corte}))}));
  }
  try {
    const hechos = [];
    for (const leido of envios)
      hechos.push(await apiLogistica('/api/logistica/indicadores/' + r.tipo, {method: 'POST', body: JSON.stringify(leido)}));
    estado.className = 'estado ok';
    estado.textContent = hechos.map(h => r.corte ? `✓ Guardado: ${n0(h.filas)} ${r.unidad} al corte del ${fc(h.hasta)}.`
      : `✓ Guardado: ${n0(h.filas)} filas del ${fc(h.desde)} al ${fc(h.hasta)}.`).join(' ');
    delete pendiente[r.tipo];
    $('file-' + r.tipo).value = '';
    // Si todavia no habia nada que mostrar, la pagina se arma desde cero.
    if ($('desde')) await cargarReportes(true); else await cargarTodo();
  } catch (err) {
    estado.className = 'estado err'; estado.textContent = 'No se pudo guardar: ' + err.message;
    if (btn) btn.disabled = false;
  }
}

// ---- Fechas ----
function renderFiltro(){
  $('filtro').innerHTML = `
    <div class="filtro">
      <div class="campo"><label for="desde">Desde</label><input type="date" id="desde"></div>
      <div class="campo"><label for="hasta">Hasta</label><input type="date" id="hasta"></div>
      <span class="alcance" id="alcance"></span>
    </div>`;
  const ultimo = fechasElegibles[fechasElegibles.length - 1];
  $('desde').value = fechasElegibles.find(f => f.slice(0, 7) === ultimo.slice(0, 7));
  $('hasta').value = ultimo;
  ['desde', 'hasta'].forEach(id => {
    VMOCalendario.mejorar($(id), {permitidos: fechasElegibles});
    $(id).addEventListener('change', () => cargarReportes(false));
  });
}

// ---- Dibujo ----
function render(){
  const desde = $('desde').value, hasta = $('hasta').value;
  if (!desde || !hasta) return mensaje('Elegí las dos fechas.');
  if (desde > hasta) return mensaje('La fecha "desde" es posterior a "hasta".');
  const dias = diasEnMemoria.filter(d => enRango(d.fecha));
  const ind = indicadoresDelPeriodo(dias, reportes, diasEnMemoria);
  const diasDe = tipo => new Set((reportes[tipo] || []).map(f => f.fecha)).size;
  $('alcance').innerHTML = `Bombeo: ${diasDe('bombeo')} día(s) con datos ·
    Camiones: ${dias.length} día(s) guardados · Tiempos: ${diasDe('tiempos')} día(s)<br>
    Disponibilidad: ${diasDe('disponibilidad')} · Batchadas: ${diasDe('batchadas')} · Bitácora: ${diasDe('incidencias')} · Reclamos: ${diasDe('reclamos')} · Anulados: ${diasDe('anulados')} · Roturas: ${diasDe('roturas')} · Compras: ${diasDe('compras')} día(s) · Cartera: ${ind.cartera.corte ? 'corte del ' + fc(ind.cartera.corte) : 'sin corte'}<br>
    Separado en Santo Domingo y Punta Cana donde el reporte trae la planta`;
  $('contenido').innerHTML = seccionMetas(metasDelPeriodo(dias, ind))
    + seccionBombeo(ind.bombeo) + seccionCamiones(ind.camiones) + seccionTiempos(ind.tiempos)
    + seccionDisponibilidad(ind.disponibilidad) + seccionCarga(ind.eficiencia, ind.carga)
    + seccionServicio(ind.incidencias, ind.reclamos) + seccionDesperdicio(ind.desperdicio)
    + seccionCartera(ind.cartera) + seccionCubicacion(ind.cubicacion) + seccionResistencia(ind.resistencia) + seccionCompras(ind.compras);
}

const estadoMeta = c => c === null ? '<span class="em">— Sin dato</span>'
  : c ? '<span class="em si">✓ Cumple</span>' : '<span class="em no">✗ No cumple</span>';
function tarjetaMeta(titulo, que, x, fmt, metaTexto, detalle){
  const valor = v => v === null ? (x.vacio || 'Sin dato') : fmt(v);
  return `<div class="kpi m ${x.cumple === null ? 'sd' : x.cumple ? 'si' : 'no'}">
    <div class="cab"><div class="label">${titulo}</div>
    <div class="sub">${que}</div></div>
    <div class="value">${valor(x.valor)}</div>
    <div class="sub">${estadoMeta(x.cumple)}<br>meta: ${metaTexto}</div>
    <div class="pie">${x.zonas ? `<div class="zonas-meta">${x.zonas.map(z => `<span>${esc(z.zona)}: <strong>${valor(z.valor)}</strong>${z.cumple === null ? '' : z.cumple ? ' ✓' : ' ✗'}</span>`).join('')}</div>` : ''}${detalle ? `<div class="sub">${detalle}</div>` : ''}</div></div>`;
}

                               : `<td class="num gris" title="${sinDatoTexto(g)}">Sin dato</td>`;

      <div class="panel-body">${graficoPorDia(dias, conDato, colores)}

function graficoPorDia(dias, zonas, colores){
  if (!dias.length || !zonas.length) return '<div class="empty-state">Sin pedidos con Hora Fin en estas fechas.</div>';
  const W = 1180, H = 190, P = 40;
  const X = i => dias.length === 1 ? W / 2 : P + i * (W - 2 * P) / (dias.length - 1);
  const Y = v => H - 26 - v / 100 * (H - 50);
  const cada = Math.ceil(dias.length / 24);
  const serie = (z, k) => { let d = '', abierto = false; const pts = [];
    dias.forEach((f, i) => { const g = z.dias.find(x => x.nombre === f);
      if (!g || g.pct === null) { abierto = false; return; }
      d += `${abierto ? 'L' : 'M'}${X(i).toFixed(1)},${Y(g.pct).toFixed(1)} `; abierto = true;
      pts.push(`<circle class="punto" cx="${X(i)}" cy="${Y(g.pct)}" r="4" fill="${colores[z.zona]}" stroke="var(--card)" stroke-width="2"><title>${esc(z.zona)} ${fcc(f)}: ${pct(g.pct)} · ${g.n} pedidos</title></circle>`); });
    return `<path d="${d}" fill="none" stroke="${colores[z.zona]}" stroke-width="2" ${k ? 'stroke-dasharray="5 4"' : ''}/>${pts.join('')}`; };
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumplimiento por día">
    ${[0, 25, 50, 75, 100].map(v => `<line x1="${P}" x2="${W - P}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${P - 6}" y="${Y(v) + 3}" text-anchor="end" fill="rgba(238,242,247,.55)" font-size="10">${v}%</text>`).join('')}
    ${dias.map((f, i) => i % cada ? '' : `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" fill="rgba(238,242,247,.55)" font-size="9.5">${fcc(f)}</text>`).join('')}
    ${zonas.map(serie).join('')}</svg>`;
}

}

// ---- Compras: entregas en el plazo (2026-11-19) ----
// La cuenta vive en comprasDelPeriodo(), en logistica.logic.js.
const calculoCompras = () => calculo('Entregas en el plazo', 'la lista de CBS "Tiempos de sol. compra": cada línea de solicitud de compra ya recibida, con los días de cada paso, el tiempo total, el objetivo y si cumple', [

  ['Fechas', 'La lista se filtra por la fecha de la orden de compra y solo trae lo ya recibido: conviene bajarla desde el mes anterior, para que entre lo que llegó después.'],
]);

function seccionCompras(k){

      <div class="kpi e"><div class="label">Días de la solicitud a la llegada</div><div class="value">${n0(k.mediana)}</div><div class="sub">valor del medio de las líneas</div></div>

    <tbody>${k.objetivos.map(o => `<tr><td><strong>${o.objetivo === null ? 'Sin objetivo' : n0(o.objetivo) + ' días'}</strong></td><td class="num">${n0(o.n)}</td><td class="num">${n0(o.cumplen)}</td>
      <td class="num" style="font-weight:700; color:${cumpleC(o.pct) ? 'var(--ok)' : 'var(--err)'};">${pct(o.pct)}</td><td class="num">${n0(o.mediana)}</td></tr>`).join('')}

// ---- Resistencia a compresion (2026-11-19) ----
// La cuenta vive en resistenciaDelPeriodo(), en logistica.logic.js.
const calculoResistencia = () => calculo('Resistencia a compresión', 'la lista de CBS "Batchada vs Roturas de Calidad": cada carga de planta con su f\'c y las roturas de sus probetas a 7 y 28 días', [
  ['Muestra', 'Una carga a la que se le tomó muestra (tiene rotura). Las demás no se usan. Si un conduce sale en dos cargas con la misma rotura, cuenta una vez.'],
  ['Cumple', 'La rotura a 28 días es igual o mayor que el f\'c pedido (la "Resistencia" de la carga).'],
  ['Resistencia', `Muestras que cumplen ÷ muestras con rotura a 28 días, de lo vaciado en las fechas elegidas. Por zona, según la planta. Meta ${METAS.resistencia.meta}% o más.`],
  ['Atraso', 'La rotura a 28 días llega 28 días después del vaciado. Lo más nuevo solo tiene la de 7 días: se cuenta aparte como "esperando los 28 días" y no entra al %. Conviene bajar la lista desde el mes anterior, para traer las roturas que llegaron después.'],
], 'la lista no trae Móvil VI, y de Móvil II trae muy pocas cargas.');

function seccionResistencia(k){
  const enc = `<div class="sec">10 · Resistencia a compresión <span class="fuente">lista de CBS "Batchada vs Roturas de Calidad" (Calidad) · rotura a 28 días ≥ f'c · meta ${METAS.resistencia.meta}%</span></div>`;
  if (!k.n && !k.pendientes) return enc + sinReporte('Batchada vs Roturas de Calidad') + calculoResistencia();
  const cumpleRes = v => v === null ? null : Math.round(v) >= METAS.resistencia.meta;
  const zonas = k.zonas.filter(z => z.zona !== 'Sin zona');
  const kpis = `<div class="kpis">
      <div class="kpi d"><div class="label">Resistencia a compresión</div><div class="value">${k.n ? pct(k.pct) : 'Sin dato'}</div>
        <div class="sub">${estadoMeta(k.n ? cumpleRes(k.pct) : null)} · meta ${METAS.resistencia.meta}% o más</div>
        <div class="sub">${n0(k.cumplen)} de ${n0(k.n)} muestras con rotura a 28 días ≥ f'c${k.ultimoVaciado ? ` · vaciados hasta el ${fc(k.ultimoVaciado)}` : ''}</div></div>
      ${zonas.map(z => `<div class="kpi d"><div class="label">${esc(z.zona)}</div><div class="value">${pct(z.pct)}</div><div class="sub">${n0(z.cumplen)} de ${n0(z.n)} muestras</div></div>`).join('')}
      <div class="kpi d"><div class="label">Esperando los 28 días</div><div class="value">${n0(k.pendientes)}</div><div class="sub">muestras que solo tienen la rotura a 7 días: no entran al %</div></div>
    </div>`;
  const plantas = k.n ? `<div class="panel"><div class="panel-head"><h2>Por planta</h2><span class="sub">muestras con rotura a 28 días, separado por zona</span></div>
    <div class="tabla"><table><thead><tr><th>Planta</th><th class="num">Muestras</th><th class="num">Cumplen</th><th class="num">%</th></tr></thead>
    <tbody>${k.zonas.map(z => filaZona(z.zona, `${n0(z.n)} muestras · ${pct(z.pct)}`, 4) + k.plantas.filter(p => p.zona === z.zona).map(p => `<tr>
      <td><strong>${esc(p.planta)}</strong></td><td class="num">${n0(p.n)}</td><td class="num">${n0(p.cumplen)}</td>
      <td class="num" style="font-weight:700; color:${cumpleRes(p.pct) ? 'var(--ok)' : 'var(--err)'};">${pct(p.pct)}</td></tr>`).join('')).join('')}
    </tbody></table></div></div>` : '';
  const fallas = !k.n ? '' : k.fallas.length ? `<div class="panel"><div class="panel-head"><h2>Muestras por debajo del f'c</h2><span class="sub">de la más baja a la más alta</span></div>
    <div class="tabla"><table><thead><tr><th>Vaciado</th><th>Conduce</th><th>Planta</th><th>Cliente</th><th class="num">f'c</th><th class="num">Rotura 28 días</th><th class="num">% del f'c</th></tr></thead>
    <tbody>${recortar('roturas-fallas', k.fallas).map(m => `<tr><td>${fc(m.fecha)}</td><td>${esc(m.conduce || '—')}</td><td>${esc(m.planta)}</td>
      <td class="corta" title="${esc(m.cliente || '')}">${esc(m.cliente || '—')}</td><td class="num">${n0(m.fc)}</td><td class="num">${n0(m.r28)}</td>
      <td class="num" style="color:var(--err); font-weight:700;">${pct(100 * m.r28 / m.fc)}</td></tr>`).join('') + botonTodos('roturas-fallas', k.fallas.length, 7)}</tbody></table></div></div>`
    : `<div class="panel"><div class="empty-state">Ninguna muestra quedó por debajo del f'c en estas fechas.</div></div>`;
  return enc + kpis + (k.n ? `<div class="dos">${plantas}${fallas}</div>`
    : `<div class="panel"><div class="empty-state">Lo vaciado en estas fechas todavía no tiene rotura a 28 días.</div></div>`) + calculoResistencia();
}

// ---- Cumplimiento a cubicacion (2026-11-19) ----
// La cuenta vive en cubicacionPorEmpleado(), en logistica.logic.js.
const calculoCubicacion = () => calculo('Cumplimiento a cubicación', 'lo cubicado, de la programación que se guarda cada día en el dashboard; lo realizado y el empleado, del reporte "Cumplimiento de tiempos de despacho"', [
  ['Por qué así', 'CBS no guarda lo cubicado: en el reporte de tiempos, la cantidad del pedido ya está ajustada a lo que se despachó. Lo cubicado sale de la programación que la app guarda cada día. Ejemplo: el 17/11 Constructora A E SRL tenía 74 m³ programados y se despacharon 90; en CBS el pedido ya dice 90.'],
  ['Cada pedido', `Se busca en la programación del día al mismo cliente a las mismas horas que las líneas del pedido. Cubicado = los m³ programados a esas horas. Realizado = todo lo que se despachó en el pedido, también las líneas que se agregaron después. Cumple si lo realizado quedó a ±${Math.round(TOLERANCIA_CUBICACION * 100)}% de lo cubicado.`],
  ['Faltó / sobró', `Faltó: se despachó más de ${Math.round(TOLERANCIA_CUBICACION * 100)}% por encima de lo cubicado (la cubicación se quedó corta). Sobró: más de ${Math.round(TOLERANCIA_CUBICACION * 100)}% por debajo (cubicación de más, o el cliente paró el vaciado).`],
  ['Cumplimiento', `Pedidos que cumplen ÷ pedidos evaluados con empleado. Los pedidos sin empleado en CBS se muestran aparte. Meta ${METAS.cubicacion.meta}% o más.`],
  ['Qué no se evalúa', 'Pedidos de días que no se guardaron en el dashboard, de clientes que no están en la programación de ese día, con todas sus horas distintas a las programadas, o que comparten hora con otro pedido del mismo cliente (no se puede partir lo programado).'],
  ['Empleado', 'La columna "Empleado" del reporte de CBS: quien cubica la obra.'],
], 'solo una parte de los pedidos trae el empleado en CBS. El reporte de tiempos subido antes del 19/11/2026 no guarda esa columna: hay que volver a subirlo.');

function seccionCubicacion(k){
  const enc = `<div class="sec">9 · Cumplimiento a cubicación <span class="fuente">programación del día (lo cubicado) contra el reporte "Cumplimiento de tiempos de despacho" (lo realizado y el empleado) · meta ${METAS.cubicacion.meta}%</span></div>`;
  if (!k.pedidos) return enc + sinReporte('Cumplimiento de tiempos de despacho') + calculoCubicacion();
  if (!k.traeEmpleado) return enc + `<div class="panel"><div class="empty-state">El reporte "Cumplimiento de tiempos de despacho" guardado en estas fechas no trae la columna Empleado. Volvé a subirlo arriba.</div></div>` + calculoCubicacion();
  const t = Math.round(TOLERANCIA_CUBICACION * 100);
  const kpis = `<div class="kpis">
      <div class="kpi t"><div class="label">Cumplimiento a cubicación</div><div class="value">${k.n ? pct(k.pct) : 'Sin dato'}</div>
        <div class="sub">${estadoMeta(k.n ? Math.round(k.pct) >= METAS.cubicacion.meta : null)} · meta ${METAS.cubicacion.meta}% o más</div>
        <div class="sub">${n0(k.cumplen)} de ${n0(k.n)} pedidos con empleado a ±${t}% de lo cubicado</div></div>
      <div class="kpi t"><div class="label">Faltó concreto</div><div class="value">${n0(k.falto)}</div><div class="sub">pedidos con más de ${t}% por encima de lo cubicado</div></div>
      <div class="kpi t"><div class="label">Sobró</div><div class="value">${n0(k.sobro)}</div><div class="sub">pedidos con más de ${t}% por debajo de lo cubicado</div></div>
      <div class="kpi t"><div class="label">Sin empleado (aparte)</div><div class="value">${k.sinEmpleado.n ? pct(k.sinEmpleado.pct) : '—'}</div><div class="sub">${n0(k.sinEmpleado.cumplen)} de ${n0(k.sinEmpleado.n)} pedidos que no traen empleado en CBS</div></div>
    </div>`;
  const f = k.fuera;
  const cobertura = `De ${n0(k.pedidos)} pedidos despachados se evaluaron ${n0(k.evaluados)}. No se cruzaron: ${n0(f.diaNoGuardado)} de días sin guardar, ${n0(f.sinCliente)} con el cliente fuera de la programación del día, ${n0(f.otraHora)} con otras horas, ${n0(f.compartida)} que comparten hora con otro pedido del mismo cliente.`;
  const fila = (nombre, e, gris) => `<tr${gris ? ' class="gris"' : ''}><td><strong>${esc(nombre)}</strong></td><td class="num">${n0(e.n)}</td><td class="num">${n0(e.cumplen)}</td>
      <td class="num" style="font-weight:700;${gris ? '' : ` color:${e.pct === null ? 'var(--muted)' : Math.round(e.pct) >= METAS.cubicacion.meta ? 'var(--ok)' : 'var(--err)'};`}">${pct(e.pct)}</td>
      <td class="num">${n1(e.cubicado)}</td><td class="num">${n1(e.realizado)}</td><td class="num">${n0(e.falto)}</td><td class="num">${n0(e.sobro)}</td></tr>`;
  const empleados = `<div class="panel"><div class="panel-head"><h2>Por empleado</h2><span class="sub">quien cubica la obra, del que más pedidos tiene al que menos</span></div>
    <div class="tabla"><table><thead><tr><th>Empleado</th><th class="num">Pedidos</th><th class="num">Cumplen</th><th class="num">%</th><th class="num">m³ cubicados</th><th class="num">m³ realizados</th><th class="num">Faltó</th><th class="num">Sobró</th></tr></thead>
    <tbody>${k.empleados.map(e => fila(e.empleado, e)).join('')}${k.sinEmpleado.n ? fila('Sin empleado (no entra al %)', k.sinEmpleado, true) : ''}</tbody></table></div>
    <div class="panel-body gris">${cobertura}</div></div>`;
  const fallas = k.fallas.length ? `<div class="panel"><div class="panel-head"><h2>Pedidos fuera de ±${t}%</h2><span class="sub">los de empleado, de la diferencia más grande a la más chica</span></div>
    <div class="tabla"><table><thead><tr><th>Fecha</th><th>Pedido</th><th>Cliente</th><th>Empleado</th><th class="num">Cubicado</th><th class="num">Realizado</th><th class="num">Diferencia</th></tr></thead>
    <tbody>${recortar('cubicacion-fallas', k.fallas).map(p => `<tr><td>${fc(p.fecha)}</td><td>${esc(p.ordComp)}</td>
      <td class="corta" title="${esc(p.cliente)}">${esc(p.cliente)}</td><td>${esc(p.empleado)}</td>
      <td class="num">${n1(p.cubicado)}</td><td class="num">${n1(p.realizado)}</td>
      <td class="num" style="color:${p.falto ? 'var(--err)' : 'var(--warn)'}; font-weight:700;">${p.diferencia > 0 ? '+' : ''}${n1(p.diferencia)} m³ · ${p.falto ? 'faltó' : 'sobró'}</td></tr>`).join('')
      + botonTodos('cubicacion-fallas', k.fallas.length, 7)}</tbody></table></div></div>` : '';
  return enc + kpis + empleados + fallas + calculoCubicacion();
}

// ---- Rotacion de cartera (2026-11-19) ----
// La cuenta vive en carteraDelPeriodo(), en logistica.logic.js. Aca se dibuja

const millones = v => v === null || v === undefined ? '—' : 'RD$ ' + (v / 1e6).toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' M';
const sumar = (lista, f) => lista.reduce((t, x) => t + (f(x) || 0), 0);
const diasTexto = v => v === null || v === undefined ? '—' : n1(v);
const cumpleCartera = v => v === null || v === undefined ? null : Math.round(v * 10) / 10 <= METAS.cartera.meta;
const OPCIONES_CARTERA = [
  ['Santo Domingo|normal', 'Santo Domingo'],

const calculoCartera = () => calculo('Rotación de cartera', 'la lista de CBS "Solicitudes" (antigüedad de saldos): cada factura con lo que se debe, repartido en tramos de 30 días al día en que se baja', [

  ['Corte', 'La lista se baja de CBS con fecha de corte (el cierre del mes) y se sube con esa fecha y la tasa del dólar de ese día. Si en las fechas elegidas hay más de un corte, se usa el último.'],
  ['US$', 'Se pasan a RD$ con la tasa del corte.'],
  ['Zona', 'Cada cliente es de Santo Domingo o de Punta Cana, y las dos zonas se miden por separado. La lista arrancó con la hoja de octubre: sus clientes son Santo Domingo, y los demás con deuda de menos de 121 días son Punta Cana y Macao. Un cliente nuevo sale solo por el nombre (PUNTA CANA, MACAO, DOMICEM) o por las plantas que le despacharon en el cargue; si no, queda sin clasificar y no entra hasta que se le elija zona.'],

], 'la hoja de octubre no dice por qué deja fuera a esos clientes ni qué es la gestión especial: se copió tal cual. Conviene confirmarlo con Créditos y Cobros.');

function seccionCartera(k){
  const enc = `<div class="sec">8 · Créditos y cobros <span class="fuente">lista de CBS "Solicitudes" (antigüedad de saldos) · rotación de cartera, meta ${METAS.cartera.meta} días o menos</span></div>`;

      ${k.zonas.map(z => `<div class="kpi f"><div class="label">Rotación · ${esc(z.zona)}</div>

        <div class="sub">corte del ${fc(k.corte)}${k.tasa ? ` · US$ a ${k.tasa}` : ''}</div></div>

    </div>`;
  const avisos = [
    k.sinClasificar.n ? `⚠ ${k.sinClasificar.n} cliente(s) nuevos sin clasificar (${millones(k.sinClasificar.saldo)}) no entran a la rotación. Elegí su zona en la tabla de abajo.` : '',
    k.automaticos ? `${k.automaticos} cliente(s) nuevos clasificados solos por el nombre o por el cargue: revisalos en la tabla.` : '',
    k.cortes.length > 1 ? `Hay ${k.cortes.length} cortes en estas fechas (${k.cortes.map(fc).join(', ')}): se usa el último.` : '',

  const pctDe = (v, t) => t ? Math.round(100 * v / t) + '%' : '—';
  const tramos = `<div class="panel"><div class="panel-head"><h2>Por tramo de antigüedad</h2><span class="sub">en RD$, lo que entra a la rotación · debajo, cuánto pesa cada tramo</span></div>
    <div class="tabla"><table><thead><tr><th>Zona</th>${TRAMOS_CARTERA.map(t => `<th class="num">${t.nombre} días<br><span class="gris">× ${t.dias}</span></th>`).join('')}<th class="num">Total</th><th class="num">Rotación</th></tr></thead>
    <tbody>${k.zonas.map(z => `<tr><td><strong>${esc(z.zona)}</strong></td>
      ${z.tramos.map(v => `<td class="num">${n0(v)}<div class="gris">${pctDe(v, z.saldo)}</div></td>`).join('')}
      <td class="num"><strong>${n0(z.saldo)}</strong></td><td class="num"><strong>${diasTexto(z.rotacion)} días</strong></td></tr>`).join('')}
    </tbody></table></div></div>`;
  const ultimo = TRAMOS_CARTERA.length - 1;
  const grupos = [
    ['Sin clasificar', k.clientes.filter(c => !c.trato)],
    ...ZONAS.map(z => [z, k.clientes.filter(c => c.zona === z && c.trato !== 'fuera')]),
    ['Fuera del indicador', k.clientes.filter(c => c.trato === 'fuera')],
  ].filter(([, cs]) => cs.length);
  const filaCliente = c => `<tr>
      <td class="corta" title="${esc(c.cliente)}"><strong>${esc(c.cliente)}</strong>${ORIGEN_CARTERA[c.origen] ? `<div class="gris">${ORIGEN_CARTERA[c.origen]}</div>` : ''}${c.trato === 'especial' ? '<div class="gris">gestión especial: el tramo de 121 o más no entra</div>' : ''}</td>
      <td class="gris">${esc(c.monedas)}</td>
      ${c.tramos.map((v, i) => `<td class="num${c.trato === 'especial' && i === ultimo && v ? ' tachado' : ''}">${v ? n0(v) : '—'}</td>`).join('')}
      <td class="num"><strong>${n0(c.saldo)}</strong></td><td class="num">${diasTexto(c.dias)}</td><td>${selectCartera(c)}</td></tr>`;
  const clientes = `<div class="panel"><div class="panel-head"><h2>Por cliente</h2><span class="sub">en RD$ (US$ × tasa del corte), del que más debe al que menos · la última columna cambia la zona</span></div>
    <div class="tabla"><table><thead><tr><th>Cliente</th><th>Moneda</th>${TRAMOS_CARTERA.map(t => `<th class="num">${t.nombre}</th>`).join('')}<th class="num">Total</th><th class="num">Días</th><th>Zona</th></tr></thead>
    <tbody>${grupos.map(([g, cs]) => { const z = k.zonas.find(x => x.zona === g);
      return filaZona(g, z ? `${cs.length} clientes · entran ${millones(z.saldo)} · rotación ${diasTexto(z.rotacion)} días`
                           : `${cs.length} clientes · ${millones(sumar(cs, c => c.saldo))}`, 10)
        + recortar('cartera-' + g, cs).map(filaCliente).join('') + botonTodos('cartera-' + g, cs.length, 10); }).join('')}
    </tbody></table></div></div>`;
  return enc + kpis + (avisos.length ? `<div class="panel"><div class="panel-body aviso">${avisos.join('<br>')}</div></div>` : '')
    + tramos + clientes + calculoCartera();
}
$('contenido').addEventListener('change', async ev => {
  const s = ev.target.closest('.sel-cartera'); if (!s || !s.value) return;
  const [zona, trato] = s.value.split('|');
  s.disabled = true;
  try {
    const r = await apiLogistica('/api/logistica/cartera/clientes', {method: 'PUT',
      body: JSON.stringify({cliente: s.dataset.cliente, zona: zona || null, trato})});
    reportes.cartera_clientes = [...(reportes.cartera_clientes || []).filter(c => normalize(c.cliente) !== normalize(r.cliente)), r];
    render();
  } catch (err) {
    s.disabled = false;
    alert('No se pudo guardar la zona: ' + err.message);
  }
});

// ---- Carga ----
async function cargarReportes(recalcularFechas){
  if (!$('desde')) return;
  try {
    const r = await apiLogistica(`/api/logistica/indicadores?desde=${encodeURIComponent($('desde').value)}&hasta=${encodeURIComponent($('hasta').value)}`);
    reportes = r;
  } catch (err) { return mensaje('No se pudieron leer los reportes: ' + esc(err.message)); }
  pintarCargados();
  if (recalcularFechas){
    fechasElegibles = [...new Set([...fechasElegibles, ...Object.values(reportes.fechas || {}).flat()])].sort();
    ['desde', 'hasta'].forEach(id => VMOCalendario.mejorar($(id), {permitidos: fechasElegibles}));
  }
  render();
}

async function cargarTodo(){
  mensaje('Cargando el historial...');
  let indice, rep;
  try {
    indice = (await apiLogistica('/api/logistica/dias')).dias;
    // Las fechas de los reportes ya subidos, para el calendario.
    rep = await apiLogistica('/api/logistica/indicadores?desde=0000-00-00&hasta=0000-00-00').catch(() => null);
  } catch (err) { return mensaje(err.sinToken ? esc(err.message) : 'No se pudo leer el historial: ' + esc(err.message)); }
  const dias = [];
  for (let i = 0; i < indice.length; i += 6){
    mensaje(`Cargando el historial... ${dias.length}/${indice.length} días`);
    const tanda = await Promise.all(indice.slice(i, i + 6).map(d =>
      apiLogistica('/api/logistica/dias/' + encodeURIComponent(d.fecha))
        .then(dia => ({fecha: d.fecha, ...restaurarDia(dia)})).catch(() => null)));
    tanda.filter(Boolean).forEach(d => dias.push(d));
  }
  diasEnMemoria = dias.sort((a, b) => a.fecha.localeCompare(b.fecha));
  const fr = rep ? rep.fechas : {};
  reportes.fechas = fr;
  pintarCargados();
  fechasElegibles = [...new Set([...diasEnMemoria.map(d => d.fecha), ...Object.values(fr).flat()])].sort();
  if (!fechasElegibles.length) return mensaje('Todavía no hay datos: guardá un día en el dashboard o subí uno de los reportes de arriba.');
  renderFiltro();
  await cargarReportes(false);
}

$('contenido').addEventListener('click', ev => {
  const b = ev.target.closest('.btn-todos'); if (!b) return;
  const id = b.dataset.lista;
  if (listasAbiertas.has(id)) listasAbiertas.delete(id); else listasAbiertas.add(id);
  render();
});
armarSubidas();
cargarTodo();
</script>
