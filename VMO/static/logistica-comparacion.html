<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparación por Día — VMO Concretos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/logistica.logic.js?v=2026-10-28"></script>
<script src="/logistica.api.js?v=2026-10-08b"></script>
<style>
  :root{
    color-scheme: dark;
    --vmo-red:#D32F2F; --vmo-red-dark:#F87171;
    --ink:#EEF2F7; --muted:rgba(238,242,247,0.55); --line:rgba(255,255,255,0.07);
    --bg:#0D1829; --card:#152535; --elevated:#1C3045;
    --ok:#34D399; --warn:#F59E0B; --err:#F87171;
    /* Las dos unidades del grafico: azul y naranja del set validado para el
       fondo oscuro (pasan daltonismo y contraste contra --card). */
    --serie-m3:#3987e5; --serie-entrega:#d95926;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter','Segoe UI',system-ui,sans-serif;
    background-color:var(--bg);
    background-image:
      radial-gradient(rgba(211,47,47,0.03) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size:40px 40px, 20px 20px; background-position:0 0, 10px 10px;
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--card); color:var(--ink); padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px; position:relative;
  }
  header::after{content:''; position:absolute; bottom:-1px; left:0; width:180px; height:2px;
    background:linear-gradient(90deg, var(--vmo-red) 0%, transparent 100%);}
  header .brand{display:flex; flex-direction:column; gap:2px;}
  header .brand .tag{text-transform:uppercase; letter-spacing:1px; font-size:10.5px; color:var(--muted);}
  header h1{margin:0; font-size:17px; font-weight:700; letter-spacing:-.2px;}

  .wrap{max-width:1300px; margin:0 auto; padding:20px 24px 60px;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:20px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.45);}
  .panel-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .panel-head h2{margin:0; font-size:14px; font-weight:700;}
  .panel-head .sub{font-size:12px; color:var(--muted);}
  .panel-body{padding:16px 18px;}

  /* ── Filtro: mes y dias ── */
  .filtro{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 16px; margin-bottom:16px;}
  .filtro-fila{display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px;}
  .filtro label, .filtro .rotulo{font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted); font-weight:700;}
  .filtro select{background:var(--elevated); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:7px 10px; font-size:13px; font-weight:600; min-width:170px;}
  .filtro select:focus-visible, .chip-dia:focus-visible, .zona-btn:focus-visible, .btn-expandir:focus-visible{
    outline:2px solid var(--vmo-red); outline-offset:2px;}
  .filtro .alcance{margin-left:auto; font-size:11.5px; color:var(--muted);}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .chip-dia{padding:5px 11px; border:1px solid var(--line); background:var(--elevated); color:var(--ink);
    border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;
    font-variant-numeric:tabular-nums;}
  .chip-dia[aria-pressed="false"]{color:var(--muted); text-decoration:line-through; opacity:.6;}
  .chip-dia:hover{border-color:rgba(255,255,255,.2);}

  /* ── General / Santo Domingo / Punta Cana ── */
  .zonas{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .zona-btn{padding:9px 18px; border:1px solid var(--line); background:var(--card); color:var(--muted);
    border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;}
  .filtro-servicio{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:11px;
    text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700;}
  .filtro-servicio select{background:var(--elevated); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; font-size:13px; font-weight:600; font-family:inherit; text-transform:none;}
  .zona-btn[aria-selected="true"]{color:var(--ink); background:var(--elevated); box-shadow:inset 0 -2px 0 var(--vmo-red);}

  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-top:3px solid var(--vmo-red);
    border-radius:12px; padding:14px 16px; box-shadow:0 1px 4px rgba(0,0,0,0.45);}
  .kpi .label{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:700;}
  .kpi .value{font-size:26px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums;}
  .kpi .value.chico{font-size:15px; line-height:1.5;}
  .kpi .sub{font-size:11px; color:var(--muted); margin-top:2px;}

  .leyenda{display:flex; gap:16px; font-size:12px; color:var(--muted);}
  .leyenda span{display:inline-flex; align-items:center; gap:6px;}
  .leyenda i{display:inline-block; width:18px; height:0; border-top:2px solid;}
  svg.grafico{display:block; width:100%; height:auto;}
  svg.grafico .punto{cursor:default;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; padding:9px 10px; background:rgba(0,0,0,.3);
    border-bottom:1px solid var(--line); color:var(--muted); font-weight:700;
    text-transform:uppercase; font-size:10.5px; letter-spacing:.7px; white-space:nowrap;}
  tbody td{padding:9px 10px; border-bottom:1px solid rgba(255,255,255,0.03); vertical-align:middle;}
  tbody tr.fila-dia:hover{background:rgba(255,255,255,.02);}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
  .tabla-scroll{overflow-x:auto;}
  /* Ancho fijo: si no, la tabla del detalle desplegado ensancha la de afuera
     y las ultimas columnas se salen de la vista. El detalle scrollea solo. */
  table.principal{table-layout:fixed; min-width:960px;}
  table.principal th:first-child{width:140px;}
  .detalle-scroll{overflow-x:auto;}
  table.sub th, table.sub td{white-space:nowrap;}
  table.sub td.texto{white-space:normal; min-width:150px;}
  .btn-expandir{border:none; background:none; padding:0; font:inherit; color:var(--ink); font-weight:700;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums;}
  .btn-expandir:hover{text-decoration:underline;}
  .btn-expandir .chev{display:inline-block; width:10px; font-size:11px; color:var(--vmo-red-dark); transition:transform .15s;}
  .btn-expandir[aria-expanded="true"] .chev{transform:rotate(90deg);}
  .sin-expandir{padding-left:18px; display:inline-block; font-variant-numeric:tabular-nums;}
  tr.fila-detalle td{background:rgba(0,0,0,.18); padding:12px 16px 16px 18px;}
  .detalle-titulo{font-size:12px; font-weight:700; color:var(--vmo-red-dark); margin-bottom:8px;}
  table.sub{font-size:12.5px; background:var(--card); border:1px solid var(--line); border-radius:8px;}
  table.sub td.obs{white-space:normal; min-width:220px; max-width:360px; line-height:1.4;}
  .sin-dato{color:var(--muted); font-style:italic;}
  .badge{display:inline-block; padding:2px 8px; border-radius:10px; background:var(--elevated);
    font-size:11px; font-weight:600; white-space:nowrap;}
  .empty-state{padding:40px 20px; text-align:center; color:var(--muted); font-size:13px;}
  .nota{font-size:12px; color:var(--muted); line-height:1.5; margin-top:12px;}
  footer{text-align:center; padding:26px; color:var(--muted); font-size:11.5px;}

  @media (max-width:900px){
    .wrap{padding:16px;}
    .kpis{grid-template-columns:1fr 1fr;}
    .filtro .alcance{margin-left:0; width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="tag">VMO Concretos · Logística</span>
    <h1>Comparación por Día</h1>
  </div>
</header>

<div class="wrap">
  <div id="filtro"></div>
  <div class="zonas" role="tablist" aria-label="Zona">
    <button class="zona-btn" role="tab" data-zona="" aria-selected="true">General</button>
    <button class="zona-btn" role="tab" data-zona="Santo Domingo" aria-selected="false">Santo Domingo</button>
    <button class="zona-btn" role="tab" data-zona="Punta Cana" aria-selected="false">Punta Cana</button>
    <label class="filtro-servicio">Servicio
      <select id="selServicio">
        <option value="">Todos</option>
        <option value="bomba">Con bomba</option>
        <option value="directo">Directo</option>
      </select>
    </label>
  </div>
  <div id="contenido"><div class="panel"><div class="panel-body"><div class="empty-state">Cargando el historial...</div></div></div></div>
</div>

<footer>VMO Concretos · Comparación por Día · Se calcula desde los días guardados, con el mismo cálculo que el dashboard del día</footer>

<script>
// Comparacion de los dias guardados, uno al lado del otro (2026-10-12).
//
// Reemplaza el HTML aparte de la companera de Axel, que leia los "Excel
// consolidados" descargados dia por dia. Aca los dias salen del historial del
// servidor y se recalculan con computeCumplimiento() —el mismo calculo del
// dashboard del dia y de Estadisticas—, asi que los porcentajes no pueden
// discrepar con lo que muestran esas pantallas. Cada renglon lo arma
// comparacionPorDia(), en logistica.logic.js, que es donde esta probado.

const pctTexto = p => p === null || p === undefined ? '—' : p + '%';
const ui = {
  dias: [],               // el historial completo, cargado una vez
  mes: 'todos',           // 'AAAA-MM' o 'todos'
  excluidos: new Set(),   // fechas que se sacaron de la vista con un clic
  zona: '',               // '' = General
  servicio: '',           // '' = todos; 'bomba' o 'directo' (2026-10-13)
  abiertos: new Set(),    // fechas con el detalle desplegado
};

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
               'septiembre','octubre','noviembre','diciembre'];
const nombreMes = ym => { const [y, m] = ym.split('-'); return MESES[Number(m) - 1] + ' ' + y; };
const fechaCorta = f => f.slice(8, 10) + '/' + f.slice(5, 7);

function mensaje(texto){
  document.getElementById('contenido').innerHTML =
    `<div class="panel"><div class="panel-body"><div class="empty-state">${texto}</div></div></div>`;
}

async function cargarTodo(){
  let indice;
  try { indice = (await apiLogistica('/api/logistica/dias')).dias; }
  catch (err) { mensaje(esc(err.sinToken ? err.message : 'No se pudo leer el historial: ' + err.message)); return; }
  if (!indice.length){
    mensaje('Todavía no hay días guardados. Guardá un día en el dashboard del día y aparece acá.');
    return;
  }
  const dias = [];
  for (let i = 0; i < indice.length; i += 6){
    mensaje(`Cargando el historial... ${dias.length}/${indice.length} días`);
    const tanda = await Promise.all(indice.slice(i, i + 6).map(d =>
      apiLogistica('/api/logistica/dias/' + encodeURIComponent(d.fecha))
        .then(dia => {
          const {state, assumptions} = restaurarDia(dia);
          const comp = computeCumplimiento(state, assumptions);
          return {fecha: d.fecha, results: comp ? comp.results : [], cargue: cargueConZona(state.cargue, assumptions.zonaPlanta),
                  motivos: state.motivos, responsables: state.responsables};
        })
        .catch(() => null)));
    tanda.filter(Boolean).forEach(d => dias.push(d));
  }
  ui.dias = dias;
  ui.fallidos = indice.length - dias.length;
  // Arranca en el mes mas reciente: es el que se compara casi siempre.
  ui.mes = dias.map(d => d.fecha.slice(0, 7)).sort().pop() || 'todos';
  render();
}

function diasDelMes(){
  return ui.mes === 'todos' ? ui.dias : ui.dias.filter(d => d.fecha.startsWith(ui.mes));
}

function renderFiltro(){
  const meses = [...new Set(ui.dias.map(d => d.fecha.slice(0, 7)))].sort().reverse();
  const delMes = [...diasDelMes()].sort((a, b) => a.fecha.localeCompare(b.fecha));
  const incluidos = delMes.filter(d => !ui.excluidos.has(d.fecha)).length;
  document.getElementById('filtro').innerHTML = `
    <div class="filtro">
      <div class="filtro-fila">
        <label for="selMes">Mes</label>
        <select id="selMes">
          <option value="todos" ${ui.mes === 'todos' ? 'selected' : ''}>Todos los meses</option>
          ${meses.map(m => `<option value="${m}" ${ui.mes === m ? 'selected' : ''}>${nombreMes(m)}</option>`).join('')}
        </select>
        <span class="alcance">${incluidos} de ${delMes.length} días en la comparación · clic en un día para sacarlo o volverlo a poner</span>
      </div>
      <div class="chips">
        ${delMes.map(d => `<button class="chip-dia" data-fecha="${d.fecha}"
            aria-pressed="${ui.excluidos.has(d.fecha) ? 'false' : 'true'}">${fechaCorta(d.fecha)}</button>`).join('')}
      </div>
    </div>`;
  document.getElementById('selMes').addEventListener('change', ev => { ui.mes = ev.target.value; render(); });
  document.querySelectorAll('.chip-dia').forEach(b => b.addEventListener('click', () => {
    const f = b.dataset.fecha;
    if (ui.excluidos.has(f)) ui.excluidos.delete(f); else ui.excluidos.add(f);
    render();
  }));
}

function render(){
  renderFiltro();
  const elegidos = diasDelMes().filter(d => !ui.excluidos.has(d.fecha));
  if (!elegidos.length){ mensaje('No hay días elegidos. Volvé a poner alguno en el filtro de arriba.'); return; }
  const filtro = ui.zona ? PREFIJO_ZONA + ui.zona : null;
  const servicio = ui.servicio || null;
  const filas = comparacionPorDia(elegidos, filtro, servicio);
  const etiqueta = (ui.zona || 'General') + (servicio ? ' · ' + NOMBRE_SERVICIO[servicio] : '');
  const acumulado = acumuladoDeCumplimiento(filtrarDiasPorServicio(filtrarDiasPorPlanta(elegidos, filtro), servicio));
  document.getElementById('contenido').innerHTML = `
    ${ui.fallidos ? `<div class="panel" style="border-color:var(--err);"><div class="panel-body" style="color:var(--err); font-size:13px;">
      ⚠ ${ui.fallidos} día(s) del historial no se pudieron cargar y no están en la comparación.</div></div>` : ''}
    ${kpisHtml(filas, acumulado)}
    <div class="panel">
      <div class="panel-head">
        <h2>% de cumplimiento por día — ${esc(etiqueta)}</h2>
        <div class="leyenda" aria-hidden="true">
          <span><i style="border-color:var(--serie-m3);"></i>${NOMBRE_PCT}</span>
          <span><i style="border-color:var(--serie-entrega); border-top-style:dashed;"></i>${NOMBRE_PCT_PEDIDOS}</span>
        </div>
      </div>
      <div class="panel-body">${graficoPct(filas)}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>m³ despachados por día — ${esc(etiqueta)}</h2></div>
      <div class="panel-body">${graficoM3(filas)}</div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h2>Detalle por día — ${esc(etiqueta)}</h2>
        <span class="sub">clic en la fecha para ver los clientes incumplidos</span>
      </div>
      <div class="tabla-scroll">${tablaHtml(filas)}</div>
    </div>
    <div class="nota">Una entrega entra al porcentaje solo si quedó <strong>Cumplida</strong> o <strong>Incumplida</strong>;
      llegar antes cuenta como cumplido y Macao no entra. <strong>${NOMBRE_PCT}</strong> pesa cada entrega por su volumen;
      <strong>${NOMBRE_PCT_PEDIDOS.toLowerCase()}</strong> cuenta las entregas que arrancaron a tiempo, todas iguales. El acumulado suma todos los días elegidos
      y divide una sola vez: no es el promedio de los porcentajes.</div>`;
  document.querySelectorAll('.btn-expandir').forEach(b => b.addEventListener('click', () => {
    const f = b.dataset.fecha;
    if (ui.abiertos.has(f)) ui.abiertos.delete(f); else ui.abiertos.add(f);
    const abierto = ui.abiertos.has(f);
    b.setAttribute('aria-expanded', String(abierto));
    document.getElementById('detalle-' + f).hidden = !abierto;
  }));
}

function kpisHtml(filas, acum){
  const conDato = filas.filter(f => f.cumplimiento.pct !== null);
  const mejor = conDato.reduce((a, b) => !a || b.cumplimiento.pct > a.cumplimiento.pct ? b : a, null);
  const peor = conDato.reduce((a, b) => !a || b.cumplimiento.pct < a.cumplimiento.pct ? b : a, null);
  const m3 = filas.reduce((s, f) => s + f.despacho.m3, 0);
  return `
    <div class="kpis">
      <div class="kpi"><div class="label">${NOMBRE_PCT}</div>
        <div class="value" style="color:${colorPct(acum.pct)}">${pctTexto(acum.pct)}</div>
        <div class="sub">${fmtInt(acum.m3Cumplidos)} de ${fmtInt(acum.m3)} m³ evaluados · ${filas.length} ${filas.length === 1 ? 'día' : 'días'}</div></div>
      <div class="kpi"><div class="label">${NOMBRE_PCT_PEDIDOS}</div>
        <div class="value" style="color:${colorPct(acum.pctPedidos)}">${pctTexto(acum.pctPedidos)}</div>
        <div class="sub">${fmtInt(acum.pedidosCumplidos)} de ${fmtInt(acum.pedidos)} entregas</div></div>
      <div class="kpi"><div class="label">m³ despachados</div>
        <div class="value">${fmtInt(m3)}</div>
        <div class="sub">sumando los días elegidos</div></div>
      <div class="kpi"><div class="label">Mejor / peor día (frec. despacho)</div>
        <div class="value chico">${mejor ? `${fechaCorta(mejor.fecha)} · ${mejor.cumplimiento.pct}%` : '—'}</div>
        <div class="sub">${peor ? `Peor: ${fechaCorta(peor.fecha)} · ${peor.cumplimiento.pct}%` : ''}</div></div>
    </div>`;
}

// Geometria comun de los dos graficos: un lugar por dia, de izquierda a
// derecha. SVG a mano, igual que Estadisticas, sin libreria.
const G = {ancho: 1100, alto: 240, izq: 44, der: 16, arr: 22, abj: 34};
const xDe = (i, n) => n === 1 ? G.izq + (G.ancho - G.izq - G.der) / 2
  : G.izq + i * (G.ancho - G.izq - G.der) / (n - 1);

function graficoPct(filas){
  const n = filas.length;
  const y = p => G.arr + (G.alto - G.arr - G.abj) * (1 - p / 100);
  const guias = [0, 25, 50, 75, 100].map(v => `
    <line x1="${G.izq}" y1="${y(v)}" x2="${G.ancho - G.der}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/>
    <text x="${G.izq - 8}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="rgba(238,242,247,.45)">${v}%</text>`).join('');
  // Una linea por unidad; un dia sin dato corta la linea en vez de bajarla a 0.
  const linea = (clave, color, punteada) => {
    let d = '', abierto = false;
    filas.forEach((f, i) => {
      const p = f.cumplimiento[clave];
      if (p === null){ abierto = false; return; }
      d += (abierto ? 'L' : 'M') + xDe(i, n).toFixed(1) + ' ' + y(p).toFixed(1) + ' ';
      abierto = true;
    });
    return d ? `<path d="${d.trim()}" fill="none" stroke="${color}" stroke-width="2"
      ${punteada ? 'stroke-dasharray="6 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>` : '';
  };
  const puntos = filas.map((f, i) => {
    const x = xDe(i, n), c = f.cumplimiento;
    const tip = `<title>${f.fecha} — ${NOMBRE_PCT}: ${pctTexto(c.pct)} (${fmtInt(c.m3Cumplidos)} de ${fmtInt(c.m3)} m³) · ${NOMBRE_PCT_PEDIDOS}: ${pctTexto(c.pctPedidos)} (${c.pedidosCumplidos} de ${c.pedidos})</title>`;
    const marca = (p, color) => p === null ? '' :
      `<circle cx="${x}" cy="${y(p)}" r="4.5" fill="${color}" stroke="#152535" stroke-width="2"/>`;
    return `<g class="punto">${tip}
      <rect x="${x - 18}" y="${G.arr - 10}" width="36" height="${G.alto - G.arr - G.abj + 20}" fill="transparent"/>
      ${marca(c.pctPedidos, 'var(--serie-entrega)')}${marca(c.pct, 'var(--serie-m3)')}
      ${c.pct !== null ? `<text x="${x}" y="${y(c.pct) - 10}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#EEF2F7">${c.pct}%</text>` : ''}
      <text x="${x}" y="${G.alto - 12}" text-anchor="middle" font-size="10.5" fill="rgba(238,242,247,.55)">${fechaCorta(f.fecha)}</text>
    </g>`;
  }).join('');
  return `<svg class="grafico" viewBox="0 0 ${G.ancho} ${G.alto}" role="img"
      aria-label="Frecuencia de despacho e inicio de carga por día">
    ${guias}${linea('pctPedidos', 'var(--serie-entrega)', true)}${linea('pct', 'var(--serie-m3)', false)}${puntos}</svg>
    <div class="nota">El número sobre cada punto es la ${NOMBRE_PCT.toLowerCase()}; pasá el mouse por un día para ver los dos con sus cuentas.
      Un día sin entregas evaluables no tiene punto: no es 0%.</div>`;
}

function graficoM3(filas){
  const n = filas.length;
  const max = Math.max(1, ...filas.map(f => f.despacho.m3));
  const paso = (G.ancho - G.izq - G.der) / Math.max(n, 1);
  const anchoBarra = Math.min(56, paso * 0.6);
  const base = G.alto - G.abj;
  const barras = filas.map((f, i) => {
    const cx = G.izq + paso * (i + 0.5);
    const h = (f.despacho.m3 / max) * (base - G.arr);
    return `<g><title>${f.fecha} — ${fmtInt(f.despacho.m3)} m³ en ${fmtInt(f.despacho.cargues)} cargues</title>
      ${h > 0 ? `<path d="M${cx - anchoBarra / 2} ${base} V${base - h + 4} q0 -4 4 -4 H${cx + anchoBarra / 2 - 4} q4 0 4 4 V${base} Z" fill="var(--serie-m3)"/>` : ''}
      <text x="${cx}" y="${base - h - 6}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#EEF2F7">${fmtInt(f.despacho.m3)}</text>
      <text x="${cx}" y="${G.alto - 12}" text-anchor="middle" font-size="10.5" fill="rgba(238,242,247,.55)">${fechaCorta(f.fecha)}</text></g>`;
  }).join('');
  return `<svg class="grafico" viewBox="0 0 ${G.ancho} ${G.alto}" role="img" aria-label="m³ despachados por día">
    <line x1="${G.izq}" y1="${base}" x2="${G.ancho - G.der}" y2="${base}" stroke="rgba(255,255,255,.15)"/>${barras}</svg>`;
}

function tablaHtml(filas){
  const mostrarZona = !ui.zona;
  const columnas = 11;
  return `<table class="principal">
    <thead><tr>
      <th>Fecha</th><th class="num">m³</th><th class="num">Cargues</th><th class="num">Camiones</th>
      <th class="num">Clientes</th><th class="num">Entregas evaluadas</th><th class="num">Cumplidas</th>
      <th class="num">Incumplidas</th><th class="num">Sin despachar</th><th class="num">% Frec. despacho</th><th class="num">% Inicio carga</th>
    </tr></thead>
    <tbody>${filas.map(f => {
      const c = f.cumplimiento, abierto = ui.abiertos.has(f.fecha);
      const celdaFecha = f.incumplidos.length
        ? `<button class="btn-expandir" data-fecha="${f.fecha}" aria-expanded="${abierto}"
             aria-controls="detalle-${f.fecha}"><span class="chev">▸</span>${f.fecha}</button>`
        : `<span class="sin-expandir">${f.fecha}</span>`;
      return `<tr class="fila-dia">
        <td>${celdaFecha}</td>
        <td class="num">${fmtInt(f.despacho.m3)}</td>
        <td class="num">${fmtInt(f.despacho.cargues)}</td>
        <td class="num">${fmtInt(f.despacho.camiones)}</td>
        <td class="num">${fmtInt(f.despacho.clientes)}</td>
        <td class="num">${fmtInt(c.pedidos)}</td>
        <td class="num">${fmtInt(c.pedidosCumplidos)}</td>
        <td class="num">${fmtInt(f.incumplidas)}</td>
        <td class="num">${fmtInt(f.sinDespachar)}</td>
        <td class="num" style="color:${colorPct(c.pct)}; font-weight:700;">${pctTexto(c.pct)}</td>
        <td class="num" style="color:${colorPct(c.pctPedidos)}; font-weight:700;">${pctTexto(c.pctPedidos)}</td>
      </tr>` + (f.incumplidos.length ? `<tr class="fila-detalle" id="detalle-${f.fecha}" ${abierto ? '' : 'hidden'}>
        <td colspan="${columnas}">
          <div class="detalle-titulo">Clientes con incumplimiento — ${f.fecha}</div>
          <div class="detalle-scroll">${detalleHtml(f.incumplidos, mostrarZona)}</div>
        </td></tr>` : '');
    }).join('')}</tbody>
  </table>`;
}

function detalleHtml(incs, mostrarZona){
  const celda = v => v ? `<td>${esc(v)}</td>` : '<td class="sin-dato">Sin dato</td>';
  const celdaObs = v => v ? `<td class="obs">${esc(v)}</td>` : '<td class="sin-dato">—</td>';
  return `<table class="sub">
    <thead><tr>
      <th>Cliente</th><th>Obra</th>${mostrarZona ? '<th>Zona</th>' : ''}<th>Planta</th>
      <th class="num">Hora prog.</th><th class="num">Llegada est.</th><th class="num">Diferencia</th><th class="num">m³</th>
      <th>Responsable</th><th>Motivo</th><th>Observación</th>
    </tr></thead>
    <tbody>${incs.map(i => `<tr>
      <td class="texto"><strong>${esc(i.cliente || '—')}</strong></td>
      <td class="texto">${esc(i.obra || '—')}</td>
      ${mostrarZona ? `<td><span class="badge">${esc(i.zona || '—')}</span></td>` : ''}
      <td>${esc(i.planta || '—')}</td>
      <td class="num">${minToStr(i.horaProg)}</td>
      <td class="num">${minToStr(i.llegada)}</td>
      <td class="num">${fmtDiff(i.diff)}</td>
      <td class="num">${fmtInt(i.m3)}</td>
      ${celda(i.responsable)}${celda(i.motivo)}
      ${celdaObs(i.observacion)}
    </tr>`).join('')}</tbody>
  </table>`;
}

document.getElementById('selServicio').addEventListener('change', ev => {
  ui.servicio = ev.target.value;
  if (ui.dias.length) render();
});

document.querySelectorAll('.zona-btn').forEach(b => b.addEventListener('click', () => {
  ui.zona = b.dataset.zona;
  document.querySelectorAll('.zona-btn').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  if (ui.dias.length) render();
}));

cargarTodo();
</script>
</body>
</html>
